name: Build, Push, and Deploy Strapi CMS to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
          labels: |
            app=annasr-cms
            org.opencontainers.image.title=${{ github.repository }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_PASSPHRASE }}
          script: |
            set -euo pipefail

            PROJECT_PATH="${{ secrets.VPS_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH="/opt/annasr-app"
            fi

            mkdir -p "$PROJECT_PATH"
            cd "$PROJECT_PATH"

            # Login ke GHCR bawaan workflow
            echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

            # Selalu perbarui file docker-compose.yml di VPS dengan konfigurasi port terbaru
            cat > docker-compose.yml << 'EOF'
            version: "3.8"

            services:
              postgres:
                image: postgres:16-alpine
                container_name: annasr-postgres
                restart: always
                environment:
                  POSTGRES_DB: ${DATABASE_NAME:-annasr_db}
                  POSTGRES_USER: ${DATABASE_USERNAME:-annasr_user}
                  POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-annasr_secure_password_123}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - shared_proxy
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-annasr_user} -d ${DATABASE_NAME:-annasr_db}"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              cms:
                image: ghcr.io/${CMS_REPOSITORY}:latest
                container_name: annasr-cms
                restart: always
                environment:
                  HOST: ${HOST:-0.0.0.0}
                  PORT: ${PORT:-1337}
                  APP_KEYS: ${APP_KEYS}
                  API_TOKEN_SALT: ${API_TOKEN_SALT}
                  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
                  JWT_SECRET: ${JWT_SECRET}
                  TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
                  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
                  DATABASE_CLIENT: ${DATABASE_CLIENT:-postgres}
                  DATABASE_HOST: ${DATABASE_HOST:-postgres}
                  DATABASE_PORT: ${DATABASE_PORT:-5432}
                  DATABASE_NAME: ${DATABASE_NAME:-annasr_db}
                  DATABASE_USERNAME: ${DATABASE_USERNAME:-annasr_user}
                  DATABASE_PASSWORD: ${DATABASE_PASSWORD:-annasr_secure_password_123}
                  DATABASE_SSL: ${DATABASE_SSL:-false}
                  DATABASE_FILENAME: ${DATABASE_FILENAME:-.tmp/data.db}
                  NODE_ENV: ${NODE_ENV:-production}
                ports:
                  - "${PORT:-1337}:${PORT:-1337}"
                volumes:
                  - strapi_uploads:/app/public/uploads
                networks:
                  - shared_proxy
                depends_on:
                  postgres:
                    condition: service_healthy

              frontend:
                image: ghcr.io/${FRONTEND_REPOSITORY}:latest
                container_name: annasr-frontend
                restart: always
                environment:
                  NEXT_PUBLIC_STRAPI_API_URL: ${NEXT_PUBLIC_STRAPI_API_URL:-http://localhost:1337}
                  NEXT_PUBLIC_STRAPI_API_TOKEN: ${NEXT_PUBLIC_STRAPI_API_TOKEN}
                ports:
                  - "${FRONTEND_PORT:-3006}:3006"
                networks:
                  - shared_proxy
                depends_on:
                  - cms

            volumes:
              postgres_data:
                driver: local
              strapi_uploads:
                driver: local

            networks:
              shared_proxy:
                external: true
            EOF

            cat > .env << EOF
            CMS_REPOSITORY=$REPO_LOWER
            FRONTEND_REPOSITORY=${{ secrets.FRONTEND_REPOSITORY }}
            HOST=${{ secrets.HOST }}
            PORT=${{ secrets.PORT }}
            APP_KEYS=${{ secrets.APP_KEYS }}
            API_TOKEN_SALT=${{ secrets.API_TOKEN_SALT }}
            ADMIN_JWT_SECRET=${{ secrets.ADMIN_JWT_SECRET }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            TRANSFER_TOKEN_SALT=${{ secrets.TRANSFER_TOKEN_SALT }}
            ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
            DATABASE_CLIENT=${{ secrets.DATABASE_CLIENT }}
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_USERNAME=${{ secrets.DATABASE_USERNAME }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_SSL=${{ secrets.DATABASE_SSL }}
            DATABASE_FILENAME=${{ secrets.DATABASE_FILENAME }}
            NODE_ENV=${{ secrets.NODE_ENV }}
            NEXT_PUBLIC_STRAPI_API_URL=${{ secrets.NEXT_PUBLIC_STRAPI_API_URL }}
            NEXT_PUBLIC_STRAPI_API_TOKEN=${{ secrets.NEXT_PUBLIC_STRAPI_API_TOKEN }}
            EOF

            # Pull image docker terbaru & restart service CMS (dan postgres jika belum aktif)
            docker compose -p annasr-app up -d postgres
            docker compose -p annasr-app pull cms
            docker compose -p annasr-app up -d --no-deps --force-recreate cms

            # Cleanup image lama (dangling & berlabel)
            docker image prune -f
            docker image prune -a -f --filter "label=app=annasr-cms"
